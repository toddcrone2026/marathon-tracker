let profile=null,userId=null,currentTab='log',selectedDate=todayStr(),foodLog=[],pendingFood=null,searchResults=[],searchTimer=null,targetsCache=null,pendingMeal='Breakfast';

function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(str){const[y,m,d]=str.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}

function saveProfile(){

}

function calcTargets(p,load){
  const wKg=(p.weightLbs||180)*0.453592,hCm=(p.heightIn||70)*2.54,a=p.age||30;
  const bmr=p.sex==='female'?10*wKg+6.25*hCm-5*a-161:10*wKg+6.25*hCm-5*a+5;
  const mult={rest:1.35,easy:1.55,hard:1.75,long:1.90}[load||p.trainingLoad||'easy']||1.55;
  let kcal=Math.round(bmr*mult);
  if(p.goal==='lose')kcal=Math.round(kcal*0.85);
  if(p.goal==='gain')kcal=Math.round(kcal*1.10);
  const protMin=Math.round((p.weightLbs||180)*0.8);
  const protKcal=Math.max(protMin*4,Math.round(kcal*0.25));
  const fatKcal=Math.round(kcal*0.25);
  const carbKcal=kcal-protKcal-fatKcal;
  return{kcal,carbs:Math.round(carbKcal/4),protein:Math.round(protKcal/4),fat:Math.round(fatKcal/9)};
}
function getTodayLoad(){return profile?.trainingLoad||'easy'}
function calcTotals(entries){return entries.reduce((acc,e)=>{const s=e.servingQty||1;acc.kcal+=Math.round((e.kcalPer||0)*s);acc.carbs+=Math.round((e.carbsPer||0)*s);acc.protein+=Math.round((e.proteinPer||0)*s);acc.fat+=Math.round((e.fatPer||0)*s);return acc},{kcal:0,carbs:0,protein:0,fat:0})}

function renderMacroBar(){
  const targets=calcTargets(profile||{},getTodayLoad()),totals=calcTotals(foodLog);
  targetsCache=targets;
  const load=getTodayLoad();
  const lL={rest:'Rest Day',easy:'Easy Run',hard:'Hard Run',long:'Long Run'};
  const lC={rest:'load-rest',easy:'load-easy',hard:'load-hard',long:'load-long'};
  document.getElementById('load-badge-wrap').innerHTML=`<span class="load-badge ${lC[load]}">${lL[load]}</span>`;
  const calPct=Math.min(totals.kcal/targets.kcal,1);
  const calOver=totals.kcal>targets.kcal,calWarn=!calOver&&totals.kcal/targets.kcal>0.85;
  const r=14,circ=2*Math.PI*r,dash=circ-calPct*circ;
  const ringCls=calOver?'over':calWarn?'warn':'';
  const calRem=targets.kcal-totals.kcal;
  function ts(c,t){if(c>t)return'over';if(c/t>0.85)return'warn';return''}
  function fw(c,t){return Math.min(Math.round(c/t*100),100)+'%'}
  const macros=[{label:'Carbs',val:totals.carbs,target:targets.carbs,cls:'carbs'},{label:'Protein',val:totals.protein,target:targets.protein,cls:'protein'},{label:'Fat',val:totals.fat,target:targets.fat,cls:'fat'}];
  document.getElementById('macro-pills-wrap').innerHTML=`
    <div class="cal-tile">
      <div class="cal-ring">
        <svg width="36" height="36" viewBox="0 0 36 36">
          <circle class="ring-bg" cx="18" cy="18" r="${r}"/>
          <circle class="ring-fill ${ringCls}" cx="18" cy="18" r="${r}" stroke-dasharray="${circ.toFixed(2)}" stroke-dashoffset="${dash.toFixed(2)}"/>
        </svg>
        <div class="ring-pct">${Math.round(calPct*100)}%</div>
      </div>
      <div class="cal-info">
        <div class="cal-num">${totals.kcal}</div>
        <div class="cal-of">of ${targets.kcal} kcal</div>
        <div class="cal-rem">${calOver?Math.abs(calRem)+' over':calRem+' left'}</div>
      </div>
    </div>
    ${macros.map(m=>{const rem=m.target-m.val,st=ts(m.val,m.target);return`<div class="macro-tile ${st}"><div class="tile-name">${m.label}</div><div class="tile-val">${m.val}g</div><div class="tile-rem">${m.val>m.target?m.val-m.target+'g over':rem+'g left'}</div><div class="macro-tile-bar"><div class="macro-tile-fill ${m.cls}" style="width:${fw(m.val,m.target)}"></div></div></div>`}).join('')}`;
}

function renderLogTab(){
  const c=document.getElementById('tab-content');
  const days=[];
  for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const s=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const label=i===0?'Today':i===1?'Yesterday':d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});days.push({s,label})}
  let html=`<div class="section-title">Food Log</div><div class="day-scroll">${days.map(d=>`<button class="day-chip ${d.s===selectedDate?'active':''}" onclick="selectDay('${d.s}')">${d.label}</button>`).join('')}</div>`;
  let totalLogged=0;
  MEAL_TYPES.forEach(meal=>{
    const entries=foodLog.filter(e=>e.meal===meal);totalLogged+=entries.length;
    const mealCals=entries.reduce((s,e)=>s+Math.round((e.kcalPer||0)*(e.servingQty||1)),0);
    html+=`<div class="meal-card"><div class="meal-hd"><div class="meal-hd-left"><span class="meal-icon">${MEAL_ICONS[meal]||'🍽'}</span><span class="meal-name">${meal}</span><span class="meal-kcal">${mealCals} kcal</span></div><button class="add-btn" onclick="goSearch('${meal}')">+ Add</button></div>`;
    if(entries.length===0){html+=`<div class="meal-empty">No foods logged</div>`}
    else{entries.forEach(e=>{const gi=foodLog.indexOf(e),cal=Math.round((e.kcalPer||0)*(e.servingQty||1));html+=`<div class="log-item"><div class="log-item-left"><div class="log-item-name">${e.name}</div><div class="log-item-srv">${e.servingUnit}</div></div><div class="log-item-kcal">${cal} kcal</div><button class="del-btn" onclick="deleteLogEntry(${gi})">✕</button></div>`})}
    html+=`</div>`;
  });
  if(totalLogged===0)html+=`<div class="empty"><div class="empty-icon">🥗</div><div class="empty-msg">Tap "+ Add" to log your first meal</div><div class="empty-sub">Search foods and track your macros</div></div>`;

async function searchFoods(q){

    const res=await fetch(url),data=await res.json(),foods=(data.foods||[]).slice(0,10);
    if(!foods.length){wrap.innerHTML=`<div class="text-muted" style="padding:16px 0;text-align:center;">No results found</div>`;return}
    searchResults=foods.map(f=>({fdcId:f.fdcId,name:f.description,brand:f.brandOwner||f.brandName||'',nutrients:f.foodNutrients||[]}));

function getNutrient(nutrients,ids){for(const id of ids){const n=nutrients.find(n=>n.nutrientId===id||n.nutrientNumber===String(id));if(n&&n.value!=null)return Math.round(n.value)}return null}
function openAddSheet(idx){

}
function updateSheetNutrients(){const qty=parseFloat(document.getElementById('sh-qty')?.value)||1,unitEl=document.getElementById('sh-unit'),grams=parseFloat(unitEl?.selectedOptions[0]?.dataset.grams||100),scale=(qty*grams)/100;document.getElementById('sh-kcal').textContent=Math.round((pendingFood.kcalPer100||0)*scale);document.getElementById('sh-carb').textContent=Math.round((pendingFood.carbsPer100||0)*scale)+'g';document.getElementById('sh-prot').textContent=Math.round((pendingFood.proteinPer100||0)*scale)+'g';document.getElementById('sh-fat').textContent=Math.round((pendingFood.fatPer100||0)*scale)+'g'}
function addToLog(){const qty=parseFloat(document.getElementById('sh-qty')?.value)||1,unitEl=document.getElementById('sh-unit'),unit=unitEl?.value||'100g',grams=parseFloat(unitEl?.selectedOptions[0]?.dataset.grams||100),scale=(qty*grams)/100,meal=document.getElementById('sh-meal')?.value||pendingMeal;foodLog.push({name:pendingFood.name,meal,servingQty:1,servingUnit:`${qty} × ${unit}`,kcalPer:Math.round((pendingFood.kcalPer100||0)*scale),carbsPer:Math.round((pendingFood.carbsPer100||0)*scale),proteinPer:Math.round((pendingFood.proteinPer100||0)*scale),fatPer:Math.round((pendingFood.fatPer100||0)*scale)});saveFoodLog();closeAddSheet();pendingMeal=meal;switchTab('log');showToast('Added to '+meal)}
function closeAddSheet(e){if(!e||e.target===document.getElementById('add-sheet-overlay'))document.getElementById('add-sheet-overlay').classList.remove('open')}

function renderSummaryTab(){
  const targets=calcTargets(profile||{},getTodayLoad()),totals=calcTotals(foodLog),c=document.getElementById('tab-content'),load=getTodayLoad();
  const lL={rest:'Rest Day',easy:'Easy Run',hard:'Hard Run',long:'Long Run'};
  function bar(cls,label,consumed,target,unit){const pct=Math.min((consumed/target)*100,100),over=consumed>target;return`<div class="prog-row ${cls}"><div class="prog-meta"><span class="prog-meta-name">${label}</span><span class="prog-meta-val">${consumed}${unit} / ${target}${unit}${over?' ⚠️':''}</span></div><div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div></div>`}
  c.innerHTML=`<div class="section-title">Daily Summary</div><div class="prog-card"><div class="prog-card-title">Macro Targets · ${lL[load]}</div>${bar('prog-cal','Calories',totals.kcal,targets.kcal,' kcal')}${bar('prog-carb','Carbs',totals.carbs,targets.carbs,'g')}${bar('prog-prot','Protein',totals.protein,targets.protein,'g')}${bar('prog-fat','Fat',totals.fat,targets.fat,'g')}</div><div class="prog-card"><div class="prog-card-title">Macro Breakdown</div><div class="breakdown-grid"><div><div class="breakdown-pct" style="color:#7c5cfc">${totals.kcal>0?Math.round(totals.carbs*4/totals.kcal*100):0}%</div><div class="breakdown-name">Carbs</div></div><div><div class="breakdown-pct" style="color:var(--primary)">${totals.kcal>0?Math.round(totals.protein*4/totals.kcal*100):0}%</div><div class="breakdown-name">Protein</div></div><div><div class="breakdown-pct" style="color:var(--teal)">${totals.kcal>0?Math.round(totals.fat*9/totals.kcal*100):0}%</div><div class="breakdown-name">Fat</div></div></div><div class="divider"></div><div style="font-size:12px;color:var(--text2);line-height:1.6;">Targets via Mifflin-St Jeor BMR × ${{rest:'1.35',easy:'1.55',hard:'1.75',long:'1.90'}[load]} activity multiplier${profile?.goal==='lose'?' with 15% deficit':profile?.goal==='gain'?' with 10% surplus':''}. Protein floored at 0.8g/lb bodyweight.</div></div><div class="prog-card"><div class="prog-card-title">Remaining</div>${[{label:'Calories',rem:targets.kcal-totals.kcal,unit:'kcal'},{label:'Carbs',rem:targets.carbs-totals.carbs,unit:'g'},{label:'Protein',rem:targets.protein-totals.protein,unit:'g'},{label:'Fat',rem:targets.fat-totals.fat,unit:'g'}].map(r=>`<div class="rem-row"><span class="rem-label">${r.label}</span><span class="rem-val" style="color:${r.rem<0?'var(--danger)':r.rem===0?'var(--primary)':'var(--text1)'}">${r.rem<0?Math.abs(r.rem)+r.unit+' over':r.rem+r.unit+' left'}</span></div>`).join('')}</div>`;
}

function openSettings(){renderSettings();document.getElementById('settings-overlay').classList.add('open')}
function closeSettings(e){if(!e||e.target===document.getElementById('settings-overlay'))document.getElementById('settings-overlay').classList.remove('open')}
function renderSettings(){
  const p=profile||{},ft=p.heightIn?Math.floor(p.heightIn/12):'',ins=p.heightIn?p.heightIn%12:'';
  const lL={rest:'Rest Day',easy:'Easy Run',hard:'Hard Run',long:'Long Run'},gL={performance:'Performance',maintain:'Maintain',lose:'Lose Weight',gain:'Gain Weight'};
  document.getElementById('settings-body').innerHTML=`<div class="sheet-handle"></div><div class="sheet-title">Settings</div><div class="set-section"><div class="set-title">Profile</div><div class="set-card"><div class="set-row"><span class="set-row-label">Name</span><span class="set-row-val">${p.name||'—'}</span></div><div class="set-row"><span class="set-row-label">Height</span><span class="set-row-val">${ft?ft+"'"+ins+'"':'—'}</span></div><div class="set-row"><span class="set-row-label">Weight</span><span class="set-row-val">${p.weightLbs?p.weightLbs+' lbs':'—'}</span></div><div class="set-row"><span class="set-row-label">Age</span><span class="set-row-val">${p.age||'—'}</span></div><div class="set-row"><span class="set-row-label">Sex</span><span class="set-row-val" style="text-transform:capitalize">${p.sex||'—'}</span></div><div class="set-row"><span class="set-row-label">Goal</span><span class="set-row-val">${gL[p.goal]||'—'}</span></div></div></div><div class="set-section"><div class="set-title">Today's Training Load</div><div class="set-card"><div class="load-grid">${['rest','easy','hard','long'].map(v=>`<button class="load-opt ${(p.trainingLoad||'easy')===v?'active':''}" onclick="setLoad('${v}')">${lL[v]}</button>`).join('')}</div></div></div><div class="set-section"><div class="set-title">Update Stats</div><div class="set-card" style="padding:16px"><div class="form-row" style="margin-bottom:12px"><div class="form-group" style="margin:0"><label class="form-label">Weight (lbs)</label><input class="form-input" id="s-lbs" type="number" value="${p.weightLbs||''}"></div><div class="form-group" style="margin:0"><label class="form-label">Age</label><input class="form-input" id="s-age" type="number" value="${p.age||''}"></div></div><button class="btn btn-primary" onclick="saveStats()">Save Stats</button></div></div><div style="text-align:center;padding-bottom:8px"><button onclick="resetApp()" style="background:none;border:none;color:var(--danger);font-family:inherit;font-size:13px;cursor:pointer">Reset App Data</button></div>`;
}
function setLoad(load){profile.trainingLoad=load;saveProfile();renderMacroBar();renderSettings();if(currentTab==='summary')renderSummaryTab();showToast('Training load updated')}
function saveStats(){const lbs=parseFloat(document.getElementById('s-lbs')?.value),age=parseInt(document.getElementById('s-age')?.value);if(lbs&&lbs>50)profile.weightLbs=lbs;if(age&&age>14)profile.age=age;saveProfile();renderMacroBar();renderSettings();if(currentTab==='summary')renderSummaryTab();showToast('Stats saved')}
function resetApp(){if(!confirm('Reset all app data? This cannot be undone.'))return;try{localStorage.removeItem('nutrition_profile')}catch(e){}profile=null;userId=null;foodLog=[];showWizard()}
</script>
</body>
</html>
